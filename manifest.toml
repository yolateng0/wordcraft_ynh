packaging_format = 2

id = "wordcraft"
name = "WordCraft"
description.en = "Open-source word processor running in the browser via WebAssembly. The documents are open and saved in the user’s browser. Nothing is stored on the server, so there’s no data to save."
description.fr = "Traitement de texte open source dans le navigateur via WebAssembly. Les documents sont ouverts et enregistrés dans le navigateur de l'utilisateur. Rien n'est stocké sur le serveur : il n'y a donc aucune donnée à sauvegarder."

# Version amont + "~ynh1" (incrémenter ~ynh2, ~ynh3… pour une retouche du paquet seule)
version = "0.15.1~ynh1"

maintainers = ["yolateng0"]

[upstream]
license = "MIT OR Apache-2.0"
website = "https://github.com/storytold/wordcraft"
code = "https://github.com/storytold/wordcraft"

[integration]
yunohost = ">= 12.0.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
# WordCraft n'a pas de comptes utilisateurs : l'accès est protégé par le portail
# SSO de YunoHost (permissions SSOWAT adossées à l'annuaire LDAP), pas par l'app.
ldap = "not_relevant"
sso = "not_relevant"
disk = "100M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/wordcraft"

    # Accès restreint par défaut aux utilisateurs YunoHost (annuaire LDAP).
    # Choisir "visitors" pour un accès public, ou un groupe précis.
    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]
    # Release web officielle de WordCraft (wordcraft-web-<version>.zip)
    [resources.sources.main]
    url = "https://github.com/storytold/wordcraft/releases/download/v0.18.1/wordcraft-web-0.18.1.zip"
sha256 = "3daa7c2d1f209a7eeb2527fcefa3fe31e875848fb1970d68f54edae55fe0bc9f"
    in_subdir = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "^wordcraft-web-.*\\.zip$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.label = "WordCraft"
    main.show_tile = true
    # Pas de compte côté app : inutile de transmettre l'identité SSO en en-tête HTTP
    main.auth_header = false
