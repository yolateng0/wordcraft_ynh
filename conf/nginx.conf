location __PATH__/ {

    alias __INSTALL_DIR__/;
    index index.html;

    # L'accès (SSO / LDAP) est géré par SSOWAT via la permission "main".

    # En-têtes de sécurité
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Referrer-Policy: same-origin";
    more_set_headers "X-Frame-Options: SAMEORIGIN";

    # Revalider à chaque chargement : une mise à jour de l'app est visible tout de suite
    more_set_headers "Cache-Control: no-cache";

    # Compression du WebAssembly et des scripts
    gzip on;
    gzip_types application/wasm application/javascript text/css application/json;
}
